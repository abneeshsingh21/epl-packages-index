name: Register Package

on:
  repository_dispatch:
    types: [register-package]

permissions:
  contents: write

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract package info
        id: pkg
        env:
          PKG_NAME: ${{ github.event.client_payload.name }}
          PKG_VERSION: ${{ github.event.client_payload.version }}
          PKG_DESCRIPTION: ${{ github.event.client_payload.description }}
          PKG_AUTHOR: ${{ github.event.client_payload.author }}
          PKG_LICENSE: ${{ github.event.client_payload.license }}
          PKG_REPO: ${{ github.event.client_payload.repository }}
          PKG_KEYWORDS: ${{ github.event.client_payload.keywords }}
          PKG_ENTRY: ${{ github.event.client_payload.entry }}
          PKG_EPL_VERSION: ${{ github.event.client_payload.epl_version }}
          PKG_CHECKSUM: ${{ github.event.client_payload.checksum }}
          PKG_DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
          PKG_SIZE: ${{ github.event.client_payload.size }}
        run: |
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "repo=$PKG_REPO" >> $GITHUB_OUTPUT

      - name: Quality Gate — Validate package
        env:
          PKG_NAME: ${{ github.event.client_payload.name }}
          PKG_VERSION: ${{ github.event.client_payload.version }}
          PKG_DESCRIPTION: ${{ github.event.client_payload.description }}
          PKG_AUTHOR: ${{ github.event.client_payload.author }}
          PKG_LICENSE: ${{ github.event.client_payload.license }}
          PKG_REPO: ${{ github.event.client_payload.repository }}
          PKG_ENTRY: ${{ github.event.client_payload.entry }}
          PKG_DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
        run: |
          python3 << 'EOF'
          import os, re, sys, json

          name = os.environ.get('PKG_NAME', '')
          version = os.environ.get('PKG_VERSION', '')
          description = os.environ.get('PKG_DESCRIPTION', '')
          author = os.environ.get('PKG_AUTHOR', '')
          license_name = os.environ.get('PKG_LICENSE', '')
          repo = os.environ.get('PKG_REPO', '')
          entry = os.environ.get('PKG_ENTRY', '')
          download_url = os.environ.get('PKG_DOWNLOAD_URL', '')

          errors = []

          # 1. Name validation
          NAME_RE = re.compile(r'^[a-zA-Z][a-zA-Z0-9_-]{1,63}$')
          RESERVED = {'epl', 'epl-core', 'epl-std', 'epl-lang', 'epl-cli', 'test', 'tests', 'node', 'python', 'java', 'rust'}
          if not name:
              errors.append('Missing package name')
          elif not NAME_RE.match(name):
              errors.append(f'Invalid package name: {name}')
          elif name.lower() in RESERVED:
              errors.append(f'Reserved package name: {name}')

          # 2. Version validation (basic semver)
          SEMVER_RE = re.compile(r'^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$')
          if not version:
              errors.append('Missing version')
          elif not SEMVER_RE.match(version):
              errors.append(f'Invalid semver version: {version}')

          # 3. Required fields
          if not description or len(description) < 10:
              errors.append('Description must be at least 10 characters')
          if not author:
              errors.append('Missing author')
          if not license_name:
              errors.append('Missing license')
          if not repo:
              errors.append('Missing repository URL')
          if not download_url:
              errors.append('Missing download URL')

          # 4. Check for duplicate name (different owner)
          pkg_dir = f'packages/{name}'
          if os.path.isdir(pkg_dir):
              with open(f'{pkg_dir}/metadata.json') as f:
                  existing = json.load(f)
              existing_repo = existing.get('repository', '')
              if repo and existing_repo and existing_repo != repo:
                  # Different repo trying to claim same name
                  existing_owner = existing_repo.split('github.com/')[-1].split('/')[0] if 'github.com' in existing_repo else ''
                  new_owner = repo.split('github.com/')[-1].split('/')[0] if 'github.com' in repo else ''
                  if existing_owner != new_owner:
                      errors.append(f'Package name "{name}" already registered by {existing_owner}')

          # 5. Download URL must be HTTPS
          if download_url and not download_url.startswith('https://'):
              errors.append('Download URL must use HTTPS')

          if errors:
              print('❌ Quality gate FAILED:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print(f'✅ Quality gate PASSED: {name} v{version} by {author}')
          EOF

      - name: Register package in index
        env:
          PKG_NAME: ${{ github.event.client_payload.name }}
          PKG_VERSION: ${{ github.event.client_payload.version }}
          PKG_DESCRIPTION: ${{ github.event.client_payload.description }}
          PKG_AUTHOR: ${{ github.event.client_payload.author }}
          PKG_LICENSE: ${{ github.event.client_payload.license }}
          PKG_REPO: ${{ github.event.client_payload.repository }}
          PKG_KEYWORDS: ${{ github.event.client_payload.keywords }}
          PKG_ENTRY: ${{ github.event.client_payload.entry }}
          PKG_EPL_VERSION: ${{ github.event.client_payload.epl_version }}
          PKG_CHECKSUM: ${{ github.event.client_payload.checksum }}
          PKG_DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
          PKG_SIZE: ${{ github.event.client_payload.size }}
        run: |
          python3 << 'EOF'
          import json, os, time

          name = os.environ.get('PKG_NAME', '')
          version = os.environ.get('PKG_VERSION', '')
          now = time.time()

          pkg_dir = f'packages/{name}'
          os.makedirs(pkg_dir, exist_ok=True)

          # Build metadata
          metadata = {
              'name': name,
              'description': os.environ.get('PKG_DESCRIPTION', ''),
              'author': os.environ.get('PKG_AUTHOR', ''),
              'license': os.environ.get('PKG_LICENSE', ''),
              'repository': os.environ.get('PKG_REPO', ''),
              'homepage': os.environ.get('PKG_REPO', ''),
              'keywords': [k.strip() for k in os.environ.get('PKG_KEYWORDS', '').split(',') if k.strip()],
              'created_at': now,
              'updated_at': now,
          }

          # Build version entry
          version_entry = {
              'version': version,
              'checksum': os.environ.get('PKG_CHECKSUM', ''),
              'download_url': os.environ.get('PKG_DOWNLOAD_URL', ''),
              'published_at': now,
              'yanked': False,
              'dependencies': {},
              'epl_version': os.environ.get('PKG_EPL_VERSION', '>=7.5.0'),
              'size': int(os.environ.get('PKG_SIZE', '0') or '0'),
              'entry': os.environ.get('PKG_ENTRY', 'src/main.epl'),
          }

          # If package exists, update it; otherwise create new
          meta_path = f'{pkg_dir}/metadata.json'
          versions_path = f'{pkg_dir}/versions.json'

          if os.path.isfile(meta_path):
              with open(meta_path) as f:
                  existing_meta = json.load(f)
              existing_meta['updated_at'] = now
              existing_meta['description'] = metadata['description'] or existing_meta['description']
              metadata = existing_meta

          if os.path.isfile(versions_path):
              with open(versions_path) as f:
                  versions_data = json.load(f)
              # Replace existing version or append
              versions_data['versions'] = [v for v in versions_data['versions'] if v['version'] != version]
              versions_data['versions'].append(version_entry)
          else:
              versions_data = {'versions': [version_entry]}

          with open(meta_path, 'w') as f:
              json.dump(metadata, f, indent=2)
          with open(versions_path, 'w') as f:
              json.dump(versions_data, f, indent=2)

          print(f'✅ Registered: {name} v{version}')
          EOF

      - name: Regenerate index.json
        run: |
          python3 << 'EOF'
          import json, os, time

          packages_dir = 'packages'
          all_packages = {}

          for name in sorted(os.listdir(packages_dir)):
              meta_path = os.path.join(packages_dir, name, 'metadata.json')
              versions_path = os.path.join(packages_dir, name, 'versions.json')
              if not os.path.isfile(meta_path):
                  continue
              with open(meta_path) as f:
                  metadata = json.load(f)
              with open(versions_path) as f:
                  versions_data = json.load(f)
              versions = versions_data.get('versions', [])
              latest = versions[-1]['version'] if versions else '0.0.0'
              all_packages[name] = {
                  'metadata': metadata,
                  'versions': versions,
                  'latest': latest,
              }

          index = {
              'packages': all_packages,
              'updated_at': time.time(),
              'total_packages': len(all_packages),
              'registry': 'https://abneeshsingh21.github.io/epl-packages-index',
          }

          with open('index.json', 'w') as f:
              json.dump(index, f, indent=2)
          os.makedirs('docs', exist_ok=True)
          with open('docs/index.json', 'w') as f:
              json.dump(index, f, indent=2)

          print(f'Index updated: {len(all_packages)} packages')
          EOF

      - name: Commit and push
        run: |
          git config user.name "epl-registry-bot"
          git config user.email "epl-registry-bot@users.noreply.github.com"
          git add packages/ index.json docs/index.json
          git diff --cached --quiet || git commit -m "pkg: Register ${{ github.event.client_payload.name }} v${{ github.event.client_payload.version }}"
          git push
